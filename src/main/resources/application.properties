spring.application.name=NexLead-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=2003
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.docker.compose.enabled=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

# Default admin (seeded on first startup when no users exist)
# Override in production via environment variables: ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME
app.admin.email=${ADMIN_EMAIL:admin@adoredezign.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Adore Dezign Admin}